name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool intltool autoconf automake libcurl4-openssl-dev \
            pkg-config libglib2.0-dev libgtk-3-dev autopoint

      - name: Run autoconf
        run: ./autogen.sh

      - name: Build
        run: make -j2

      - name: Run tests
        run: make check VERBOSE=1

      - name: Check distribution
        run: make -j2 distcheck

  ui-tests:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool intltool autoconf automake libcurl4-openssl-dev \
            pkg-config libglib2.0-dev libgtk-3-dev autopoint \
            xvfb dbus at-spi2-core python3-gi gir1.2-atspi-2.0

      - name: Run autoconf
        run: ./autogen.sh

      - name: Build
        run: make -j2

      - name: Run UI tests
        run: make -C tests check-ui

      - name: Upload screenshots and logs of failed UI tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: tests/ui-test-results/
          if-no-files-found: ignore
